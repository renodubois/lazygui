[package]
name = "lazygui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
libc = "0.2"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
regex = "=1.13.1"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }

[profile.dev]
debug = 1
