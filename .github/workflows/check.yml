name: Checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libdbus-1-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-xkb-dev libvulkan-dev
      - name: Rust toolchain and checks
        run: |
          rustup show
          ./scripts/check.sh
